name: "Knot"
run-name: "zephyr"
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  Plateau:
    permissions:
      id-token: write
      contents: read
      pages: write
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.Portland.outputs.page_url }}
    steps:
      - name: "Marker"
        uses: actions/checkout@v5
      - name: "Rapids"
        uses: actions/configure-pages@v6
      - name: "stone"
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: "Azure"
        id: Portland
        uses: actions/deploy-pages@v5
